<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lot Flip</title>
<style>
:root {
  --bg: #141b12; --card: #1f2b1a; --card-hover: #293823; --text: #f0f7ec; --mut: #9bb38c;
  --acc: #4caf50; --acc-hover: #43a047; --line: #33462b; --warn: #e53935; --grass: #2e4d22;
  --gold: #ffb300; --blue: #29b6f6; --purple: #ab47bc;
  box-sizing: border-box;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.4 system-ui, -apple-system, sans-serif;
  display: flex; justify-content: center; min-height: 100vh; padding: 12px;
}
#app { width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: 12px; }

header { display: flex; justify-content: space-between; align-items: center; }
h1 { font-size: 22px; margin: 0; display: flex; align-items: center; gap: 8px; }

/* Streamlined Top Status Ribbon */
.status-ribbon {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 8px 14px; gap: 10px; font-size: 13px; color: var(--mut);
}
.status-ribbon .item { display: flex; align-items: center; gap: 6px; }
.status-ribbon .item b { color: var(--text); font-size: 15px; }

.progress-container { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; }
.progress-labels { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; color: var(--mut); }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--acc); width: 0; transition: width 0.3s; }

/* Neighborhood Scene */
#scene {
  background: var(--grass); border: 2px solid var(--line); border-radius: 16px;
  padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: inset 0 2px 8px rgba(0,0,0,0.3);
}

.lot-row { 
  display: grid; 
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); 
  gap: 12px; 
}

/* Roads & Cars */
.road {
  height: 38px; background: #222; border-radius: 6px; position: relative; overflow: hidden;
  border: 1px solid #444; display: flex; align-items: center;
}
.road::before {
  content: ""; position: absolute; left: 0; right: 0; top: 18px;
  border-top: 3px dashed #777;
}
.road span {
  position: absolute; font-size: 22px; display: inline-block;
}
.car-top { top: 1px; }
.car-bottom { top: 15px; }
.car-right { transform: scaleX(-1); animation: drive-right 9s linear infinite; }
.car-left { animation: drive-left 11s linear infinite; }
@keyframes drive-right { from { left: -15%; } to { left: 115%; } }
@keyframes drive-left { from { left: 115%; } to { left: -15%; } }

/* Fixed-Size Lot Cards */
.lot {
  background: var(--card); border: 2px solid var(--line); border-radius: 12px;
  padding: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center;
  color: var(--text); font: inherit; transition: transform 0.1s, border-color 0.2s;
  position: relative; height: 165px; justify-content: space-between; overflow: hidden;
}
.lot:hover { border-color: var(--acc); transform: translateY(-3px); }
.lot.hot { border-color: var(--gold); animation: pulse 1.5s infinite; }
@keyframes pulse { 50% { border-color: var(--acc); } }

.lot svg { width: 100%; height: 68px; display: block; flex-shrink: 0; }
.lot-info { width: 100%; text-align: center; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; height: 48px; justify-content: center; }
.lot-title { font-size: 12px; font-weight: 600; color: var(--mut); }
.lot-action {
  background: rgba(255,255,255,0.07); border-radius: 6px; padding: 3px 4px;
  font-size: 11px; font-weight: 700; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.lot .pb { width: 100%; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; flex-shrink: 0; }
.lot .pb i { display: block; height: 100%; background: var(--gold); width: 0; }

/* Inline Offer Overlay on House Card */
.house-offer-overlay {
  position: absolute; inset: 0; background: rgba(20, 27, 18, 0.94); backdrop-filter: blur(2px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; z-index: 10; padding: 6px; text-align: center;
}
.house-offer-title { font-size: 11px; color: var(--mut); font-weight: 700; text-transform: uppercase; }
.house-offer-price { font-size: 16px; font-weight: 800; color: var(--gold); }
.house-offer-btns { display: flex; gap: 8px; margin-top: 4px; }
.house-offer-btns button {
  border: 0; border-radius: 8px; width: 38px; height: 34px; font-size: 18px; cursor: pointer; font-weight: 700;
  display: flex; align-items: center; justify-content: center; transition: transform 0.1s;
}
.house-offer-btns button:hover { transform: scale(1.1); }
.accept-offer { background: var(--acc); color: #fff; }
.reject-offer { background: var(--warn); color: #fff; }

.pop {
  position: absolute; top: 12px; right: 12px; font-weight: 700; color: var(--acc);
  background: var(--card); border: 1px solid var(--acc); border-radius: 8px;
  padding: 2px 8px; font-size: 13px; animation: popanim 1s ease-out forwards; pointer-events: none; z-index: 20;
}
@keyframes popanim { to { transform: translateY(-24px); opacity: 0; } }

/* Action Toolbar */
.shop { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
button.b {
  background: var(--card); color: var(--text); border: 2px solid var(--line);
  border-radius: 12px; padding: 12px 8px; font: inherit; font-size: 13px;
  cursor: pointer; text-align: center; font-weight: 700; transition: background 0.2s, border-color 0.2s;
}
button.b:disabled { opacity: 0.4; cursor: default; border-color: var(--line); }
button.b:not(:disabled):hover { background: var(--card-hover); border-color: var(--acc); }
button.b.active { border-color: var(--blue); background: rgba(41, 182, 246, 0.15); color: var(--blue); }

#msg { font-size: 13px; color: var(--mut); min-height: 20px; text-align: center; }

/* Overlay Modal */
#ov {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100;
}
#ov .box {
  background: var(--card); border: 2px solid var(--line); border-radius: 20px;
  padding: 28px; max-width: 420px; text-align: center; display: flex; flex-direction: column; gap: 14px;
}
#ov h2 { margin: 0; font-size: 26px; }
#ov p { margin: 0; color: var(--mut); font-size: 14px; line-height: 1.5; }
.mode-select { display: flex; gap: 10px; justify-content: center; margin: 4px 0; }
.mode-btn {
  flex: 1; padding: 10px; border: 2px solid var(--line); border-radius: 10px; background: var(--bg);
  color: var(--text); cursor: pointer; font-weight: 700; font-size: 13px;
}
.mode-btn.selected { border-color: var(--gold); background: rgba(255, 179, 0, 0.15); color: var(--gold); }

#ov button.go-btn {
  background: var(--acc); color: #fff; border: 0; border-radius: 12px;
  padding: 14px; font: inherit; font-size: 18px; font-weight: 700; cursor: pointer; transition: background 0.2s;
}
#ov button.go-btn:hover { background: var(--acc-hover); }

/* Build Choice Drawer */
#choice { position: fixed; bottom: 20px; left: 16px; right: 16px; max-width: 860px; margin: 0 auto; z-index: 50; }
.choice-drawer {
  background: var(--card); border: 2px solid var(--acc); border-radius: 16px;
  padding: 14px 18px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}
.build-opts { display: flex; flex-wrap: wrap; gap: 8px; }
.build-btn {
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
  color: var(--text); cursor: pointer; font-size: 12px; text-align: center; font-weight: 600;
}
.build-btn:hover { border-color: var(--acc); }
.build-btn b { display: block; color: var(--gold); font-size: 13px; }
.close-btn { background: var(--line); color: var(--text); border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 700; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🏘️ Lot Flip</h1>
    <div id="msg"></div>
  </header>

  <!-- Streamlined Top Status Ribbon -->
  <div class="status-ribbon">
    <div class="item">Money: <b id="money">$0</b></div>
    <div class="item">Goal: <b id="goal">$0</b></div>
    <div class="item">Time: <b id="time">0s</b></div>
    <div class="item">Builders: <b id="bld">0/0</b></div>
    <div class="item">Rent: <b id="rent">$0/s</b></div>
    <div class="item">Avg Val: <b id="lp">$0</b></div>
  </div>

  <div class="progress-container">
    <div class="progress-labels"><span>Goal Progress</span><span id="pct">0%</span></div>
    <div class="bar"><i id="gbar"></i></div>
  </div>

  <!-- Game Grid Area -->
  <div id="scene"></div>

  <!-- Action Toolbar -->
  <div class="shop">
    <button class="b" id="hire"></button>
    <button class="b" id="tools"></button>
    <button class="b" id="sellmode"></button>
  </div>
</div>

<div id="choice"></div>

<div id="ov">
  <div class="box">
    <h2>🏘️ Lot Flip</h2>
    <p>Buy empty lots, build Ranch, Colonial, or Mansion homes, and rent them automatically for passive income or list them to flip for big profits!</p>
    <div><b>Select Game Mode:</b></div>
    <div class="mode-select">
      <button class="mode-btn selected" id="m-timed">⏱️ Timed Campaign</button>
      <button class="mode-btn" id="m-relaxed">☕ Relaxed Goal Mode</button>
    </div>
    <button class="go-btn" id="go">Start Level 1</button>
  </div>
</div>

<script>
const SPECS = {
  ranch: { name: "Ranch", cost: 250, dur: 3.5, baseVal: 450, rentMult: 1.0, boost: 0, icon: "🏡" },
  colonial: { name: "Colonial", cost: 450, dur: 5.5, baseVal: 800, rentMult: 1.3, boost: 0.15, icon: "🏛️" },
  mansion: { name: "Mansion", cost: 800, dur: 8.0, baseVal: 1500, rentMult: 1.8, boost: 0.30, icon: "🏰" },
  park: { name: "Park", cost: 400, dur: 4.0, baseVal: 300, rentMult: 0, boost: 0.25, rentBoost: 0.20, icon: "🌳" },
  civic: { name: "Civic Center", cost: 800, dur: 6.0, baseVal: 600, rentMult: 0, globalBoost: 0.15, income: 15, icon: "🏛️" }
};

const COL = ["#e4a672", "#8fb5d9", "#e48b8b", "#b9d98f", "#e0d08a", "#b49ad9"];
let lv = 1, N = 6, money = 0, goal = 0, tl = 0, elapsed = 0, builders = 2, speed = 1, lots = [], els = [], last = 0, run = false;
let sellMode = false, gameMode = "timed";

const $ = id => document.getElementById(id);
const fmt = n => "$" + Math.round(n);
const mk = () => ({ st: "empty", style: null, p: 0, dur: 0, c: 0, wait: 0, offer: null, rent: 0, rt: 0, price: Math.round(100 + Math.random() * 120), pt: 2 + Math.random() * 5, isAI: false });
const msg = t => $("msg").textContent = t;
const busy = () => lots.filter(l => l.st === "working").length;

function build() {
  const sc = $("scene"); sc.innerHTML = "";
  const n1 = Math.ceil(N / 3), n2 = Math.ceil((N - n1) / 2), n3 = N - n1 - n2;
  let idx = 0;

  const mkRow = c => {
    const r = document.createElement("div"); r.className = "lot-row";
    for (let k = 0; k < c; k++) {
      const i = idx++, bt = document.createElement("div"); bt.className = "lot";
      bt.innerHTML = '<svg viewBox="0 0 100 60"></svg><div class="lot-info"><div class="lot-title">Lot ' + (i + 1) + '</div><div class="lot-action"></div></div><div class="pb"><i></i></div>';
      bt.onclick = (e) => { if(!e.target.closest('.house-offer-overlay')) click(i); }; 
      r.appendChild(bt);
    }
    return r;
  };
  
  const roadRight = () => {
    const rd = document.createElement("div"); rd.className = "road";
    rd.innerHTML = '<span class="car-top car-right">🚗</span>'; return rd;
  };
  const roadLeft = () => {
    const rd = document.createElement("div"); rd.className = "road";
    rd.innerHTML = '<span class="car-bottom car-left">🚙</span>'; return rd;
  };

  sc.appendChild(mkRow(n1));
  sc.appendChild(roadRight());
  sc.appendChild(mkRow(n2));
  sc.appendChild(roadLeft());
  sc.appendChild(mkRow(n3));
  els = [...sc.querySelectorAll(".lot")];
}

function startLevel() {
  N = Math.min(12, 3 + lv * 3); 
  lots = Array.from({ length: N }, mk);

  // Setup 2 Pre-built AI Neighbor Houses
  const aiTypes = ["ranch", "colonial"];
  for (let k = 0; k < 2; k++) {
    const aiSlot = k * 3 + 1;
    if (aiSlot < N) {
      const typeKey = aiTypes[k % aiTypes.length];
      const spec = SPECS[typeKey];
      lots[aiSlot] = {
        st: "listed", style: typeKey, p: 1, dur: 0, c: k + 1, wait: 3,
        offer: null, rent: Math.round((12 + lv * 2) * spec.rentMult), rt: 3,
        price: Math.round(spec.baseVal * (0.9 + Math.random() * 0.3)), pt: 3, isAI: true
      };
    }
  }

  $("choice").innerHTML = "";
  money = 600 + lv * 50; goal = 1500 + lv * 350; tl = Math.max(90, 180 - lv * 8); elapsed = 0;
  builders = 2; speed = 1; sellMode = false;
  build(); run = true; last = performance.now();
  $("ov").style.display = "none";
  msg("Level " + lv + ": Reach " + fmt(goal) + (gameMode === "timed" ? " before time expires." : " at your own pace."));
  draw();
}

function getLotValue(i) {
  const l = lots[i];
  if (l.st === "empty") return l.price;
  const spec = l.style ? SPECS[l.style] : null;
  let base = spec ? spec.baseVal : l.price;

  let globalMult = 1.0;
  lots.forEach(other => {
    if ((other.st === "rented" || other.st === "listed" || other.st === "sold") && other.style) {
      const s = SPECS[other.style];
      if (s.globalBoost) globalMult += s.globalBoost;
    }
  });

  let adjMult = 1.0;
  [i - 1, i + 1].forEach(adjIdx => {
    if (adjIdx >= 0 && adjIdx < N) {
      const adjLot = lots[adjIdx];
      if ((adjLot.st === "rented" || adjLot.st === "listed" || adjLot.st === "sold") && adjLot.style) {
        const s = SPECS[adjLot.style];
        if (s.boost) adjMult += s.boost;
      }
    }
  });

  return Math.round(base * globalMult * adjMult);
}

function click(i) {
  if (!run) return;
  const l = lots[i];
  if (l.offer) return;

  if (sellMode) {
    if (l.st === "need" && l.p === 0) {
      money += l.price; const p = l.price, t = l.pt;
      Object.assign(l, mk(), { price: p, pt: t });
      msg("Sold empty lot for " + fmt(p) + ".");
    } else {
      msg("Can only sell unworked empty lots.");
    }
    draw(); return;
  }

  if (l.st === "empty") {
    if (money < l.price) return msg("Not enough money to buy lot (" + fmt(l.price) + ").");
    money -= l.price; l.st = "need"; l.c = Math.floor(Math.random() * COL.length);
  } else if (l.st === "need") {
    openBuildDrawer(i);
  } else if (l.st === "rented" || l.st === "listed") {
    if (l.isAI && l.st === "listed") {
      const curVal = getLotValue(i);
      if (money < curVal) return msg("Need " + fmt(curVal) + " to purchase AI listing.");
      money -= curVal; l.isAI = false; l.st = "rented";
      msg("Purchased AI Property! Now generating passive rent.");
    } else {
      toggleSaleList(i);
    }
  }
  draw();
}

function openBuildDrawer(i) {
  const l = lots[i], c = $("choice");
  let html = '<div class="choice-drawer"><div><b style="font-size:15px;">Build on Lot ' + (i + 1) + '</b></div><div class="build-opts">';
  
  Object.keys(SPECS).forEach(key => {
    const s = SPECS[key];
    html += '<button class="build-btn" onclick="startBuild(' + i + ','' + key + '')">' + s.icon + ' ' + s.name + '<br><b>' + fmt(s.cost) + '</b></button>';
  });

  html += '</div><button class="close-btn" onclick="$('choice').innerHTML=''">Cancel</button></div>';
  c.innerHTML = html;
}

function startBuild(i, typeKey) {
  $("choice").innerHTML = "";
  const l = lots[i], spec = SPECS[typeKey];
  if (busy() >= builders) return msg("All builders are busy!");
  if (money < spec.cost) return msg("Not enough money for " + spec.name + " (" + fmt(spec.cost) + ").");
  
  money -= spec.cost; l.st = "working"; l.style = typeKey; l.p = 0; l.dur = spec.dur / speed;
  msg("Started building " + spec.name + "...");
  draw();
}

function toggleSaleList(i) {
  const l = lots[i], c = $("choice");
  const isListed = l.st === "listed";
  c.innerHTML = '<div class="choice-drawer"><div><b style="font-size:15px;">Lot ' + (i + 1) + ' (' + (l.style ? SPECS[l.style].name : 'House') + ')</b><br><small style="color:var(--mut);">' + (isListed ? 'Currently listed for sale.' : 'Earning ' + fmt(l.rent) + '/3s rent.') + '</small></div><div class="ab"><button class="acc-btn" onclick="doList(' + i + ',' + (!isListed) + ')">' + (isListed ? 'Unlist / Resume Renting' : 'List for Sale') + '</button><button class="close-btn" onclick="$('choice').innerHTML=''">Close</button></div></div>';
}

function doList(i, makeListed) {
  $("choice").innerHTML = "";
  const l = lots[i];
  if (makeListed) {
    l.st = "listed"; l.wait = 1.5 + Math.random() * 2;
    msg("Listed Lot " + (i + 1) + " for sale. Rent paused while on market.");
  } else {
    l.st = "rented"; l.offer = null;
    msg("Unlisted Lot " + (i + 1) + ". Passive rent resumed.");
  }
  draw();
}

function pop(i, a) {
  const e = els[i]; if (!e) return;
  const s = document.createElement("span"); s.className = "pop"; s.textContent = "+" + fmt(a);
  e.appendChild(s); setTimeout(() => s.remove(), 1000);
}

function spawn(i) {
  const l = lots[i], v = getLotValue(i), price = Math.round(v * (0.85 + Math.random() * 0.4));
  const t = 7 + Math.random() * 3;
  l.offer = { price, ttl: t, max: t };
  draw();
}

function resolve(i, ok) {
  const l = lots[i];
  if (!l.offer) return;
  const price = l.offer.price;
  l.offer = null;
  if (ok && run) {
    money += price; l.st = "sold"; l.style = null; l.rent = 0;
    msg("Sold Lot " + (i + 1) + " for " + fmt(price) + "!");
  } else {
    l.wait = 2 + Math.random() * 3;
    msg("Offer rejected. Waiting for next buyer...");
  }
  draw();
}

function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (run) {
    if (gameMode === "timed") tl -= dt;
    else elapsed += dt;

    // Municipal revenue tick from Civic Centers
    lots.forEach(l => {
      if ((l.st === "rented" || l.st === "listed" || l.st === "sold") && l.style === "civic") {
        money += (SPECS.civic.income / 3) * dt;
      }
    });

    lots.forEach((l, i) => {
      l.pt -= dt; 
      if (l.pt <= 0) { 
        l.pt = 5 + Math.random() * 2; 
        l.price = Math.round(Math.min(280, Math.max(90, l.price + (Math.random() - 0.5) * 60))); 
      }
      
      // Auto-Rent Income Calculation
      if (l.st === "rented" && l.style && SPECS[l.style].rentMult > 0) {
        l.rt -= dt; 
        if (l.rt <= 0) { 
          l.rt += 3;
          let adjRentMult = 1.0;
          [i - 1, i + 1].forEach(adjIdx => {
            if (adjIdx >= 0 && adjIdx < N) {
              const adj = lots[adjIdx];
              if (adj.style && SPECS[adj.style].rentBoost) adjRentMult += SPECS[adj.style].rentBoost;
            }
          });
          const rentAmt = Math.round((12 + lv * 3) * SPECS[l.style].rentMult * adjRentMult);
          l.rent = rentAmt;
          money += rentAmt; 
          pop(i, rentAmt); 
        }
      }

      if (l.st === "working") { 
        l.p += dt / l.dur; 
        if (l.p >= 1) { 
          l.p = 1; 
          const spec = SPECS[l.style];
          if (spec.rentMult > 0) {
            l.st = "rented"; l.rent = Math.round((12 + lv * 3) * spec.rentMult); l.rt = 3;
            msg("Finished " + spec.name + "! Automatically rented for " + fmt(l.rent) + "/3s.");
          } else {
            l.st = "rented"; msg("Finished building " + spec.name + "!");
          }
        } 
      }
      else if (l.st === "listed" && !l.offer && !l.isAI) { l.wait -= dt; if (l.wait <= 0) spawn(i); }
      else if (l.st === "listed" && l.offer) {
        l.offer.ttl -= dt;
        if (l.offer.ttl <= 0) { l.offer = null; l.wait = 2 + Math.random() * 3; msg("Offer expired."); }
      }
    });

    if (money >= goal) { run = false; end(true); } 
    else if (gameMode === "timed" && tl <= 0) { run = false; end(false); }
    draw();
  }
  requestAnimationFrame(tick);
}

function end(win) {
  const ov = $("ov"); ov.style.display = "flex";
  ov.querySelector(".box").innerHTML = win ?
    '<h2>🎉 Level ' + lv + ' Complete!</h2><p>Goal reached! Total cash: ' + fmt(money) + '.</p><button class="go-btn" id="go">Next Level</button>' :
    '<h2>⏰ Time’s Up</h2><p>You made ' + fmt(money) + ' of ' + fmt(goal) + '.</p><button class="go-btn" id="go">Retry Level ' + lv + '</button>';
  $("go").onclick = () => { if (win) lv++; startLevel(); };
}

function art(l) {
  const st = l.st;
  if (st === "empty") return '<rect x="47" y="25" width="4" height="25" fill="#7a5a36"/><rect x="24" y="12" width="52" height="18" rx="2" fill="#fff"/><text x="50" y="24" font-size="7" font-weight="700" text-anchor="middle" fill="#e53935">FOR SALE</text>';
  
  if (l.style === "park") return '<rect x="10" y="45" width="80" height="10" rx="3" fill="#5d8a3a"/><circle cx="35" cy="30" r="14" fill="#6ba041"/><circle cx="65" cy="28" r="18" fill="#588e33"/><rect x="33" y="40" width="4" height="8" fill="#5a4025"/><rect x="63" y="40" width="4" height="8" fill="#5a4025"/>';
  if (l.style === "civic") return '<rect x="15" y="42" width="70" height="12" fill="#999"/><rect x="20" y="20" width="60" height="22" fill="#ccc"/><polygon points="15,20 50,5 85,20" fill="#777"/><rect x="28" y="24" width="6" height="18" fill="#eee"/><rect x="47" y="24" width="6" height="18" fill="#eee"/><rect x="66" y="24" width="6" height="18" fill="#eee"/>';

  let s = '<rect x="12" y="42" width="76" height="12" rx="3" fill="#8a6a45"/>';
  if (l.style === "ranch") s += '<rect x="18" y="26" width="64" height="18" fill="' + COL[l.c] + '"/><polygon points="14,27 50,12 86,27" fill="#a8483a"/>';
  else if (l.style === "colonial") s += '<rect x="22" y="18" width="56" height="26" fill="' + COL[l.c] + '"/><polygon points="16,20 50,6 84,20" fill="#7a3a30"/><rect x="44" y="28" width="12" height="14" fill="#553311"/>';
  else if (l.style === "mansion") s += '<rect x="16" y="16" width="68" height="28" fill="' + COL[l.c] + '"/><polygon points="10,18 50,2 90,18" fill="#3a4a7a"/><rect x="22" y="8" width="10" height="10" fill="#aaa"/>';
  
  if (st === "working") s += '<text x="65" y="52" font-size="16">👷</text>';
  return s;
}

function draw() {
  $("money").textContent = fmt(money); $("goal").textContent = fmt(goal);
  $("time").textContent = gameMode === "timed" ? Math.max(0, Math.ceil(tl)) + "s" : Math.floor(elapsed) + "s";
  $("bld").textContent = (builders - busy()) + "/" + builders;
  
  const totalRentPerSec = lots.reduce((a, l) => a + ((l.st === "rented" && l.style && SPECS[l.style].rentMult > 0) ? (l.rent / 3) : 0), 0) + lots.filter(l => l.style === "civic").length * 15;
  $("rent").textContent = "$" + totalRentPerSec.toFixed(1) + "/s";
  $("lp").textContent = fmt(lots.reduce((a, l, idx) => a + getLotValue(idx), 0) / (lots.length || 1));
  
  const pct = Math.min(100, Math.round(money / goal * 100));
  $("gbar").style.width = pct + "%"; $("pct").textContent = pct + "%";

  $("hire").textContent = "Hire Builder ($300)"; $("hire").disabled = !run || money < 300 || builders >= 5;
  $("tools").textContent = "Better Tools ($250)"; $("tools").disabled = !run || money < 250 || speed >= 2;
  $("sellmode").textContent = sellMode ? "Sell Mode: ON" : "Sell Empty Lots";
  $("sellmode").classList.toggle("active", sellMode);

  lots.forEach((l, i) => {
    const el = els[i]; if (!el) return;
    
    // Non-blocking Inline Offer Overlay
    let offerOverlay = el.querySelector(".house-offer-overlay");
    if (l.offer) {
      if (!offerOverlay) {
        offerOverlay = document.createElement("div");
        offerOverlay.className = "house-offer-overlay";
        offerOverlay.innerHTML = '<div class="house-offer-title">Offer!</div><div class="house-offer-price"></div><div class="house-offer-btns"><button class="accept-offer" title="Accept">✓</button><button class="reject-offer" title="Reject">✕</button></div>';
        offerOverlay.querySelector(".accept-offer").onclick = (e) => { e.stopPropagation(); resolve(i, true); };
        offerOverlay.querySelector(".reject-offer").onclick = (e) => { e.stopPropagation(); resolve(i, false); };
        el.appendChild(offerOverlay);
      }
      offerOverlay.querySelector(".house-offer-price").textContent = fmt(l.offer.price);
    } else if (offerOverlay) {
      offerOverlay.remove();
    }

    let lbl = "", pb = 0;
    if (l.st === "empty") lbl = "Buy<br>" + fmt(l.price);
    else if (l.st === "need") lbl = sellMode ? "Sell Lot" : "Build Options";
    else if (l.st === "working") { lbl = SPECS[l.style].name + "..."; pb = l.p; }
    else if (l.st === "rented") lbl = SPECS[l.style].rentMult > 0 ? "Rented (" + fmt(l.rent) + "/3s)" : SPECS[l.style].name;
    else if (l.st === "listed") {
      if (l.isAI) lbl = "AI For Sale (" + fmt(getLotValue(i)) + ")";
      else lbl = l.offer ? "Offer Received!" : "Listed...";
    }
    else lbl = "Sold ✔";

    const k = l.st + l.style + l.c;
    if (el._k !== k) { el._k = k; el.querySelector("svg").innerHTML = art(l); }
    el.querySelector(".lot-action").innerHTML = lbl;
    el.querySelector(".pb i").style.width = pb * 100 + "%";
    el.classList.toggle("hot", l.st === "need" || !!l.offer);
  });
}

$("hire").onclick = () => { if (money >= 300) { money -= 300; builders++; draw(); } };
$("tools").onclick = () => { if (money >= 250) { money -= 250; speed += 0.25; draw(); } };
$("sellmode").onclick = () => { sellMode = !sellMode; msg(sellMode ? "Sell Mode ON: Tap any empty bought lot to sell it back." : "Sell Mode OFF."); draw(); };

$("m-timed").onclick = () => { gameMode = "timed"; $("m-timed").classList.add("selected"); $("m-relaxed").classList.remove("selected"); };
$("m-relaxed").onclick = () => { gameMode = "relaxed"; $("m-relaxed").classList.add("selected"); $("m-timed").classList.remove("selected"); };
$("go").onclick = startLevel;

requestAnimationFrame(tick);
</script>
</body>
</html>
